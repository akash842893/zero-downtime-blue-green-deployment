apiVersion: v1
kind: Secret
metadata:
  name: platform-secrets
  namespace: zero-downtime-platform
type: Opaque
stringData:
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "your_secure_postgres_password_here"
  DATABASE_URL: "postgresql://postgres:your_secure_postgres_password_here@postgres-service:5432/bluegreen_db"
