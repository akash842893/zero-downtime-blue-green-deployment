services:
  # Database Service (PostgreSQL 15)
  db:
    image: postgres:15-alpine
    container_name: zero-downtime-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-bluegreen_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-bluegreen_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Backend BLUE Environment
  backend-blue:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend-blue
    restart: always
    ports:
      - "8001:8000"
    environment:
      APP_VERSION: ${BLUE_APP_VERSION:-1.0.0}
      DEPLOYMENT_ENV: blue
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_secure_pass}@db:5432/${POSTGRES_DB:-bluegreen_db}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s

  # Backend GREEN Environment
  backend-green:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend-green
    restart: always
    ports:
      - "8002:8000"
    environment:
      APP_VERSION: ${GREEN_APP_VERSION:-1.1.0}
      DEPLOYMENT_ENV: green
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_secure_pass}@db:5432/${POSTGRES_DB:-bluegreen_db}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s

  # Frontend BLUE Environment
  frontend-blue:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend-blue
    restart: always
    ports:
      - "3001:80"
    environment:
      VITE_API_URL: http://localhost:8001

  # Frontend GREEN Environment
  frontend-green:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend-green
    restart: always
    ports:
      - "3002:80"
    environment:
      VITE_API_URL: http://localhost:8002

  # Nginx Reverse Proxy & Traffic Router
  nginx:
    image: nginx:alpine
    container_name: nginx-router
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/blue.conf:/etc/nginx/conf.d/blue.conf:ro
      - ./nginx/green.conf:/etc/nginx/conf.d/green.conf:ro
      - ./nginx/active.conf:/etc/nginx/conf.d/active.conf:ro
    depends_on:
      - backend-blue
      - frontend-blue

volumes:
  postgres_data:
